# ===================================================================
# BT5 - SPRING BOOT 4 + JSP/JSTL CONFIGURATION
# ===================================================================
spring.application.name=bt5-springboot4-jsp
server.port=8080

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# SQL Server DataSource (tuong thich voi CSDL webst2 tu folder D:\web)
spring.datasource.url=jdbc:sqlserver://localhost:1433;encrypt=true;trustServerCertificate=true;databaseName=webst2
spring.datasource.username=sa
spring.datasource.password=1234567@a$
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Thu muc luu anh upload cuc bo (fallback tuong tu Constant.DIR trong D:\web)
app.upload.dir=${user.home}/bt5-uploads
