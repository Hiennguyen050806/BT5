# ===================================================================
# PROFILE H2 (Dung de chay demo nhanh hoac test ma khong can SQL Server)
# Chay: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ===================================================================
spring.datasource.url=jdbc:h2:mem:webst2;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
